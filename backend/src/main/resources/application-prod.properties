# Base de données & ORM / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Niveau de logs en production (INFO par défaut)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.example=INFO

# Documentation OpenAPI / Swagger (Désactivé en production)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Restrictions Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Désactiver DDL Auto Hibernate (ne pas laisser update ou create)
spring.jpa.hibernate.ddl-auto=validate

# Activer Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration