spring.application.name=Spring App
server.port=${PORT:8080}

# ===================================================================
# 1. BASE DE DONNÉES & FLYWAY (Production)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate : Validation uniquement (Flyway gère la création des tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway : Migration de schéma
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# 2. LOGS & ACTUATOR
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===================================================================
# 3. SWAGGER / OPENAPI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===================================================================
# 4. SÉCURITÉ & AUTHENTIFICATION (JWT / OAuth)
# ===================================================================
application.security.secret-key=${JWT_SECRET_KEY}
application.security.access-expiration=${JWT_ACCESS_EXPIRATION:300000}
application.security.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Google & GitHub OAuth
google.client.id=${GOOGLE_CLIENT_ID}

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
github.oauth.authorize-url=https://github.com/login/oauth/authorize
github.oauth.token-url=https://github.com/login/oauth/access_token
github.oauth.user-api-url=https://api.github.com/user

# GitHub Webhooks & Encryption
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}
app.webhook.github-url=${APP_GITHUB_WEBHOOK_URL}
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY}

# ===================================================================
# 5. CONFIGURATION MAIL
# ===================================================================
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# URLs Frontend
application.mailing.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:4200/activate-account}
application.mailing.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password-url}